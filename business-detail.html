<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>پروفایل کسب‌وکار | سوگ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/business.css">
</head>
<body>
  <div class="app-frame">
    <main id="bp" class="bp"></main>
  </div>

  <!-- بۀ‌شیت سفارش -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="order-sheet" id="orderSheet" hidden role="dialog" aria-modal="true" aria-label="سفارش سریع">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span id="sheetTitle">سفارش سریع</span>
      <button class="icon-btn" id="sheetClose" aria-label="بستن">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="orderForm" class="sheet-body">
      <label>نوع خدمت <select name="service" id="orderService"></select></label>
      <label>نام و نام خانوادگی <input name="name" type="text" placeholder="مثال: علی رضایی" required></label>
      <label>شماره تماس <input name="phone" type="tel" inputmode="tel" placeholder="۰۹…" required></label>
      <label>توضیحات / آدرس <textarea name="note" rows="3" placeholder="جزئیات سفارش، آدرس، زمان مورد نظر…"></textarea></label>
      <button type="submit" class="btn-primary">ارسال سفارش به واتساپ</button>
    </form>
  </div>

  <script src="assets/js/util.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/business-detail.js"></script>
</body>
</html>
