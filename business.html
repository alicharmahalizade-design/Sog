<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>کسب‌وکارها و خدمات مراسم | سوگ</title>
  <meta name="description" content="خدمات و کسب‌وکارهای مراسم سوگ: قاری قرآن، سنگ قبر، چاپ، گل، تشریفات و سفارش سریع.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/business.css">
</head>
<body data-nav="business">
  <div class="app-frame">
    <!-- هدر -->
    <header class="app-header">
      <button class="icon-btn" id="menuBtn" aria-label="منو">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button class="icon-btn" id="profileBtn" aria-label="حساب کاربری">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="جستجو" aria-label="جستجو">
      </div>
      <a class="logo" href="index.html" aria-label="سوگ">
        <img src="assets/img/logo.svg" alt="سوگ" width="52" height="34">
      </a>
    </header>

    <div class="page-tabs">
      <a href="index.html" class="tab">آگهی‌های سوگ</a>
      <a href="business.html" class="tab is-active">خدمات مراسمات</a>
    </div>

    <nav class="city-bar" id="cityBar" aria-label="انتخاب شهر"></nav>

    <section class="cat-section">
      <h2 class="block-title">دسته‌بندی خدمات</h2>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <section class="featured-section" id="featuredSection" hidden>
      <h2 class="block-title">کسب‌وکارهای ویژه</h2>
      <div class="featured-track" id="featuredTrack"></div>
    </section>

    <main id="bizList" class="biz-list"></main>
    <div id="emptyState" class="empty-state" hidden><p>کسب‌وکاری برای این بخش یافت نشد.</p></div>
  </div>

  <!-- بۀ‌شیت سفارش سریع -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="order-sheet" id="orderSheet" hidden role="dialog" aria-modal="true" aria-label="سفارش سریع">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span id="sheetTitle">سفارش سریع</span>
      <button class="icon-btn" id="sheetClose" aria-label="بستن">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="orderForm" class="sheet-body">
      <label>نوع خدمت
        <select name="service" id="orderService"></select>
      </label>
      <label>نام و نام خانوادگی
        <input name="name" type="text" placeholder="مثال: علی رضایی" required>
      </label>
      <label>شماره تماس
        <input name="phone" type="tel" inputmode="tel" placeholder="۰۹…" required>
      </label>
      <label>توضیحات / آدرس
        <textarea name="note" rows="3" placeholder="جزئیات سفارش، آدرس، زمان مورد نظر…"></textarea>
      </label>
      <button type="submit" class="btn-primary">ارسال سفارش به واتساپ</button>
    </form>
  </div>

  <script src="assets/js/util.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/business.js"></script>
  <script src="assets/js/nav.js"></script>
</body>
</html>
