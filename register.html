<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ثبت سوگ | سوگ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon-192-v2.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/register.css">
</head>
<body>
  <div class="app-frame">
    <main class="reg">
      <!-- هدر -->
      <header class="reg-header">
        <div class="reg-title">
          <h1>ثبت سوگ</h1>
          <p>ثبت آگهی سوگواری</p>
        </div>
        <button class="reg-back" id="backBtn" aria-label="بازگشت">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 7l-4 4 4 4M5 11h9a5 5 0 010 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="reg-book" id="draftBtn" aria-label="ذخیره پیش‌نویس">
          <svg viewBox="0 0 24 24" width="40" height="46"><path d="M5 2h14v20l-7-5-7 5V2z" fill="#5a4632"/><path d="M12 7v6M9 10h6" stroke="#e9c88a" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>

      <!-- استپر پویا: تعداد مرحله‌ها به مراسم‌های انتخاب‌شده بستگی دارد -->
      <div class="reg-progress">
        <div class="rp-head">
          <span id="stepTitle">مشخصات درگذشته</span>
          <span id="stepCount"></span>
        </div>
        <div class="rp-bar"><span id="stepBar"></span></div>
      </div>

      <form id="regForm" novalidate>
        <div id="panels"></div>
      </form>
    </main>

    <!-- نوار اکشن -->
    <div class="reg-actions" id="regActions"></div>
  </div>

  <!-- موفقیت -->
  <div class="reg-success" id="regSuccess">
    <div class="ok"><svg viewBox="0 0 24 24" width="42" height="42"><path d="M5 12l4 4 10-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>آگهی سوگ ثبت شد</h2>
    <p>آگهی شما با موفقیت ثبت شد و پس از تأیید، در مرجع سوگ ایران منتشر می‌شود.</p>
    <a href="index.html">بازگشت به خانه</a>
  </div>

  <script src="assets/js/splash.js"></script>

  <script src="assets/js/util.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
